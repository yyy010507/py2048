[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py2048-term"
version = "1.0.0"
description = "The game 2048, playable in your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "err404" }]
keywords = ["2048", "game", "terminal", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
py2048 = "game2048.__main__:main"

[tool.setuptools]
packages = ["game2048"]

[tool.pytest.ini_options]
testpaths = ["tests"]
